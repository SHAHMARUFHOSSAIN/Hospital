<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369A1" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="800" rx="40" fill="url(#bgGrad)"/>
  <!-- Decorative Medical Pattern -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="16 16"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Doctor Female Silhouette Graphic -->
  <g filter="url(#shadow)" transform="translate(0, 40)">
    <!-- Face / Head -->
    <circle cx="400" cy="280" r="110" fill="#FCE7F3"/>
    <!-- Hair -->
    <path d="M 280 280 C 280 180 340 140 400 140 C 460 140 520 180 520 280 C 520 310 510 340 500 360 C 470 260 330 260 300 360 C 290 340 280 310 280 280 Z" fill="#334155"/>
    <!-- Stethoscope -->
    <path d="M 330 380 Q 400 480 470 380" fill="none" stroke="#0284C7" stroke-width="14" stroke-linecap="round"/>
    <circle cx="470" cy="380" r="16" fill="#0284C7"/>
    <!-- Doctor Coat Body -->
    <path d="M 240 680 C 240 500 310 420 400 420 C 490 420 560 500 560 680 Z" fill="url(#coatGrad)"/>
    <!-- Inner Shirt & Tie/Scarf -->
    <path d="M 360 420 L 400 500 L 440 420 Z" fill="#0284C7"/>
    <!-- Lapels -->
    <path d="M 310 440 L 400 580 L 330 680" fill="none" stroke="#CBD5E1" stroke-width="6"/>
    <path d="M 490 440 L 400 580 L 470 680" fill="none" stroke="#CBD5E1" stroke-width="6"/>
  </g>
  
  <!-- Medical Cross Badge -->
  <g transform="translate(620, 100)">
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" shadow="lg"/>
    <path d="M -15 -5 H -5 V -15 H 5 V -5 H 15 V 5 H 5 V 15 H -5 V 5 H -15 Z" fill="#0284C7"/>
  </g>
  
  <text x="400" y="740" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="2">CAREPLUS SPECIALIST DOCTOR</text>
</svg>
